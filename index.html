<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>翻页时钟</title>
<style>
* { margin: 0; padding: 0; }
html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
#wrap {
    width: 1024px;
    height: 768px;
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -384px;
    margin-left: -512px;
    text-align: center;
}
#clock {
    position: relative;
    top: 160px;
}
.digit {
    position: relative;
    width: 130px;
    height: 200px;
    background: #1a1a1a;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 6px 0 #000;
    display: inline-block;
    vertical-align: middle;
    margin: 0 4px;
}
.digit .top, .digit .bottom {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    background: #2a2a2a;
    color: #fff;
    font-size: 160px;
    font-weight: bold;
    text-shadow: 0 2px 4px #000;
}
.digit .top {
    top: 0;
    border-radius: 10px 10px 0 0;
    border-bottom: 3px solid #000;
    line-height: 200px;
}
.digit .bottom {
    bottom: 0;
    border-radius: 0 0 10px 10px;
    border-top: 3px solid #000;
    line-height: 0px;
}
.digit .top span, .digit .bottom span {
    display: block;
    width: 100%;
    text-align: center;
}
.digit .bottom span {
    margin-top: -100px;
}
.sep {
    display: inline-block;
    width: 40px;
    height: 200px;
    position: relative;
    vertical-align: middle;
}
.sep .dot {
    position: absolute;
    left: 50%;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 10px;
    margin-left: -10px;
    box-shadow: 0 2px 4px #000;
}
.sep .dot.t { top: 60px; }
.sep .dot.b { top: 120px; }
#date {
    position: absolute;
    bottom: 120px;
    width: 100%;
    text-align: center;
    color: #888;
    font-size: 28px;
    letter-spacing: 6px;
}
</style>
</head>
<body>
<div id="wrap">
    <div id="clock">
        <div class="digit" id="h1"><div class="top"><span>0</span></div><div class="bottom"><span>0</span></div></div>
        <div class="digit" id="h2"><div class="top"><span>0</span></div><div class="bottom"><span>0</span></div></div>
        <div class="sep"><div class="dot t"></div><div class="dot b"></div></div>
        <div class="digit" id="m1"><div class="top"><span>0</span></div><div class="bottom"><span>0</span></div></div>
        <div class="digit" id="m2"><div class="top"><span>0</span></div><div class="bottom"><span>0</span></div></div>
        <div class="sep"><div class="dot t"></div><div class="dot b"></div></div>
        <div class="digit" id="s1"><div class="top"><span>0</span></div><div class="bottom"><span>0</span></div></div>
        <div class="digit" id="s2"><div class="top"><span>0</span></div><div class="bottom"><span>0</span></div></div>
    </div>
    <div id="date"></div>
</div>
<script>
(function() {
    var prev = {};
    function pad(n) { return n < 10 ? '0'+n : ''+n; }
    function setDigit(id, val) {
        var el = document.getElementById(id);
        if (!el) return;
        var top = el.getElementsByTagName('span')[0];
        var bottom = el.getElementsByTagName('span')[1];
        if (top.innerHTML !== val) {
            bottom.innerHTML = val;
            setTimeout(function() { top.innerHTML = val; }, 120);
        }
    }
    function update() {
        var now = new Date();
        var h = pad(now.getHours());
        var m = pad(now.getMinutes());
        var s = pad(now.getSeconds());
        setDigit('h1', h[0]); setDigit('h2', h[1]);
        setDigit('m1', m[0]); setDigit('m2', m[1]);
        setDigit('s1', s[0]); setDigit('s2', s[1]);
        var w = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
        document.getElementById('date').innerHTML = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 '+w[now.getDay()];
    }
    update();
    setInterval(update, 1000);
})();
</script>
</body>
</html>
