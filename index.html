<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>翻页时钟</title>
<style>
* { margin: 0; padding: 0; }
html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
#clock {
    width: 100%;
    height: 100%;
    position: relative;
}
#time {
    position: absolute;
    top: 50%;
    left: 50%;
    margin-top: -110px;
    margin-left: -430px;
    width: 860px;
    height: 220px;
    text-align: center;
}
.digit {
    width: 110px;
    height: 170px;
    background: #1e1e1e;
    border-radius: 10px;
    display: inline-block;
    position: relative;
    margin: 0 4px;
    box-shadow: 0 5px 0 #000, inset 0 1px 0 rgba(255,255,255,0.05);
    vertical-align: middle;
    overflow: hidden;
}
.digit .num {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    line-height: 170px;
    text-align: center;
    font-size: 130px;
    font-weight: bold;
    color: #f5f5f5;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    z-index: 1;
}
.digit .line {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 3px;
    background: #000;
    z-index: 2;
    box-shadow: 0 1px 0 rgba(255,255,255,0.1);
}
.digit .shade {
    position: absolute;
    top: 50%;
    left: 0;
    width: 100%;
    height: 50%;
    background: rgba(0,0,0,0.25);
    z-index: 3;
}
.sep {
    display: inline-block;
    width: 35px;
    height: 170px;
    position: relative;
    vertical-align: middle;
}
.sep .dot {
    position: absolute;
    left: 50%;
    width: 14px;
    height: 14px;
    background: #f5f5f5;
    border-radius: 7px;
    margin-left: -7px;
    box-shadow: 0 2px 3px rgba(0,0,0,0.5);
}
.sep .dot.t { top: 50px; }
.sep .dot.b { top: 105px; }
#date {
    position: absolute;
    bottom: 60px;
    width: 100%;
    text-align: center;
    color: #555;
    font-size: 22px;
    letter-spacing: 5px;
}
</style>
</head>
<body>
<div id="clock">
    <div id="time">
        <div class="digit" id="h1"><span class="num">0</span><div class="line"></div><div class="shade"></div></div>
        <div class="digit" id="h2"><span class="num">0</span><div class="line"></div><div class="shade"></div></div>
        <div class="sep"><div class="dot t"></div><div class="dot b"></div></div>
        <div class="digit" id="m1"><span class="num">0</span><div class="line"></div><div class="shade"></div></div>
        <div class="digit" id="m2"><span class="num">0</span><div class="line"></div><div class="shade"></div></div>
        <div class="sep"><div class="dot t"></div><div class="dot b"></div></div>
        <div class="digit" id="s1"><span class="num">0</span><div class="line"></div><div class="shade"></div></div>
        <div class="digit" id="s2"><span class="num">0</span><div class="line"></div><div class="shade"></div></div>
    </div>
    <div id="date"></div>
</div>
<script>
(function() {
    function pad(n) { return n < 10 ? '0'+n : ''+n; }
    function setDigit(id, val) {
        var el = document.getElementById(id);
        if (el) el.getElementsByTagName('span')[0].innerHTML = val;
    }
    function update() {
        var now = new Date();
        var h = pad(now.getHours());
        var m = pad(now.getMinutes());
        var s = pad(now.getSeconds());
        setDigit('h1', h[0]); setDigit('h2', h[1]);
        setDigit('m1', m[0]); setDigit('m2', m[1]);
        setDigit('s1', s[0]); setDigit('s2', s[1]);
        var w = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
        document.getElementById('date').innerHTML = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 '+w[now.getDay()];
    }
    update();
    setInterval(update, 1000);
})();
</script>
</body>
</html>
